name: Analyze and test matrix

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  analyze-test:
    uses: weewx-extensions/development-tools/.github/workflows/analyze-test-matrix.yml@v6
    with:
      module-name: 'MQTTSubscribe'
      pip-list: 'paho-mqtt'
      package-list: 'mosquitto'
      latest-weewx-version: '5.5.2'
      lint-paths: './bin/user/mqttsubscribe.py ./bin/user/mqttcommon.py'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Run tests against paho-mqtt 1.6.1
  analyze-test-paho-mqtt-1-6-1:
    uses: weewx-extensions/development-tools/.github/workflows/analyze-test.yml@v6
    with:
      module-name: 'MQTTSubscribe'
      pip-list: 'paho-mqtt==1.6.1'
      package-list: 'mosquitto'
      latest-weewx-version: '5.5.2'
      lint-paths: './bin/user/mqttsubscribe.py ./bin/user/mqttcommon.py'
      # pylint cannot validate the v2 API code against paho-mqtt 1.6.1 (E1101/E1123 are false positives),
      # so this job reports lint findings without failing. The main job is the lint gate.
      lint-fail: false
      artifact-name-suffix: '-2'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
